:root { color-scheme: dark; --table: #2a1a12; }
html, body { height: 100%; }
body { background: var(--table); overflow: hidden; font-family: 'Outfit', ui-rounded, system-ui, sans-serif; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#stage.grab, #stage.grab * { cursor: grab !important; }
#stage.pull, #stage.pull * { cursor: grabbing !important; }

/* ---- the page that gets knitted. Sizes are in stitches: one stitch is 10px wide and 8px tall. ---- */
#page { width: 100%; height: 100%; position: relative; overflow: hidden; }
#mount { position: absolute; left: 0; top: 0; }
#card {
  --bg: #efe4cc; --ink: #1f3157; --accent: #c63f2c;
  position: relative; width: 1200px; height: 640px; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: 'Outfit', ui-rounded, system-ui, sans-serif; font-weight: 800;
  -webkit-user-select: none; user-select: none;
}
#card.y1 { --bg: #1f3157; --ink: #f1e7d0; --accent: #e9a63a; }
#card.y2 { --bg: #b93a2a; --ink: #f4ead6; --accent: #1d2b4d; }
#card.y3 { --bg: #2c5a47; --ink: #f1e7d0; --accent: #e7ae45; }
#card ::selection { background: var(--accent); color: var(--bg); }

.band { position: absolute; left: 0; width: 1200px; height: 72px; pointer-events: none; }
.band.top { top: 8px; } .band.bot { top: 560px; }
.band i { position: absolute; left: -10px; top: 0; width: 10px; height: 8px; }
.band .p0 { color: var(--ink); } .band .p1 { color: var(--accent); }

#head {
  position: absolute; left: 70px; top: 96px; width: 1080px; height: 312px; margin: 0; padding: 0;
  font-size: 144px; line-height: 1; font-weight: 800; letter-spacing: -.012em;
  white-space: pre-wrap; overflow-wrap: break-word; overflow: hidden;
  outline: none; cursor: text; caret-color: transparent;
  -webkit-user-select: text; user-select: text;
}
#caret { position: absolute; left: 0; top: 0; width: 20px; height: 112px; background: var(--accent); pointer-events: none; visibility: hidden; }
#caret.on { visibility: visible; }

.row { position: absolute; left: 70px; top: 432px; width: 1060px; height: 88px; }
.row > * { position: absolute; top: 0; }
.yarns { left: 0; border: 0; margin: 0; padding: 8px 0; min-width: 0; display: flex; gap: 10px; }
.yarns label { display: block; cursor: pointer; }
.yarns input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.yarns span { display: block; width: 60px; height: 72px; box-sizing: border-box; background: var(--c); border: solid var(--ink); border-width: 8px 10px; }
.yarns input:checked + span { background: linear-gradient(var(--d), var(--d)) center / 20px 24px no-repeat, var(--c); }
.yarns input:focus-visible + span { outline: solid var(--accent); outline-width: 8px; outline-offset: 0; }

.px { font-family: 'Stitch Five', monospace; font-weight: 400; font-size: 80px; line-height: 64px; letter-spacing: 0; }
.size { left: 300px; width: 320px; height: 88px; cursor: pointer; }
.size b { position: absolute; font-weight: 400; }
.size .a1 { left: 0; top: 16px; }
.size .a2 { left: 240px; top: -32px; font-size: 160px; line-height: 128px; }
#size { position: absolute; left: 50px; top: 0; -webkit-appearance: none; appearance: none; width: 180px; height: 88px; margin: 0; background: transparent; cursor: pointer; }
#size::-webkit-slider-runnable-track { height: 8px; background: var(--ink); }
#size::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 72px; margin-top: -32px; background: var(--accent); border: 0; border-radius: 0; }
#size:focus-visible { outline: solid var(--accent); outline-width: 8px; outline-offset: -8px; }

#unravel {
  left: 640px; width: 420px; height: 88px; box-sizing: border-box; padding: 16px 0 8px 30px; margin: 0; text-align: left;
  color: var(--bg); background: var(--ink); border: 0; border-radius: 0; cursor: pointer; white-space: nowrap;
}
#unravel:hover { background: var(--accent); }
#unravel:focus-visible { outline: solid var(--accent); outline-width: 8px; outline-offset: 8px; }

/* ---- outside the canvas ---- */
.corner {
  position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0;
  font: 500 15px/1 'Outfit', system-ui, sans-serif; letter-spacing: .01em;
  color: #f4ead6; background: rgba(20, 12, 8, .62);
  padding: 11px 16px; border-radius: 999px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#what { right: max(18px, env(safe-area-inset-right, 0px)); text-decoration: none; display: inline-flex; gap: 7px; align-items: center; }
#what:hover { background: rgba(20, 12, 8, .9); }
#what:focus-visible { outline: 3px solid #e9a63a; outline-offset: 3px; }
#what svg { width: 11px; height: 11px; }
#hint { left: max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; transition: opacity .8s; }
#hint.gone { opacity: 0; }
#hits { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hits i { position: absolute; box-sizing: border-box; border: 1px solid #0f0; }
</style>

vec2 vnoise2(vec2 x) { return texture(uNoise, x / 256.0).gb; }

float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
float lampAt(vec2 p) { vec2 d = (p - uLamp.xy) / uLamp.z; return 0.40 + 0.95 * exp(-dot(d, d)); }
// alb: linear albedo. s: across the yarn, -1..1. l: along it, in yarn diameters. T: unit tangent on screen.
// tilt: slope of the yarn's height along T. detail: 0..1, how much fine structure the pixel size allows.
vec3 shadeYarn(vec3 alb, float s, float l, vec2 T, float tilt, float detail, float ao, float seed, vec2 bend) {
  vec2 P = vec2(T.y, -T.x);
  float h = sqrt(max(1.0 - s * s, 0.0));
  float ph = l * 0.56 + s * 0.30 + seed;
  float ply = 0.5 + 0.5 * cos(6.2831853 * ph);
  float dply = -sin(6.2831853 * ph);
  vec2 fq = vec2(l * 2.2 + s * 1.3, s * 6.0 - l * 1.1) + seed * 37.0;
  float fib = vnoise(fq);
  float fib2 = vnoise(fq * vec2(0.45, 2.3) + 19.7);
  vec3 N = vec3(P * s * 0.92 - T * tilt, h + 0.12);
  N.xy += (T * 0.84 + P * 0.54) * dply * 0.42 * detail * h;
  N.xy += (vec2(fib, fib2) - 0.5) * 0.85 * detail;
  N.xy += bend;
  N = normalize(N);
  float nl = dot(N, LDIR);
  float diff = clamp((nl + 0.34) / 1.34, 0.0, 1.0);
  diff = mix(diff, diff * diff * (3.0 - 2.0 * diff), 0.5);
  float amb = 0.34 + 0.12 * N.z;
  float groove = mix(1.0, 0.62 + 0.38 * smoothstep(0.0, 0.7, ply), detail);
  float rim = pow(1.0 - h, 2.0);
  float toward = clamp(dot(P * sign(s), LDIR.xy) * 1.1 + 0.45, 0.0, 1.0);
  vec3 a2 = alb * (0.80 + 0.40 * mix(0.5, fib, detail)) ;
  vec3 c = a2 * (KEY * diff * 1.32 + AMB * amb) * groove * ao;
  c += mix(a2, vec3(0.9, 0.86, 0.8), 0.35) * rim * toward * 0.20 * ao;
  // fibres catching the light
  float spk = smoothstep(0.62, 0.95, vnoise(fq * vec2(3.1, 0.9) + 77.0));
  c += a2 * spk * 0.22 * detail * ao * KEY;
  return c;
}
vec3 finish(vec3 c, vec2 frag) {
  c *= 1.04;
  c = (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);
  c = pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
  c += (hash21(frag + 0.37) - 0.5) * 0.018;
  return c;
}
`;

const VS_FULL = `#version 300 es
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }
`;

// Reads the live page and gives every stitch one colour: the average of the page under it.
const FS_DOWN = `#version 300 es
precision highp float;
uniform sampler2D uPage;
uniform vec4 uCardUV;
uniform vec2 uGrid;
uniform float uLod;
out vec4 o;
void main() {
  vec2 ij = floor(gl_FragCoord.xy);
  vec3 tap[16];
  vec3 lo = vec3(0.0), hi = vec3(0.0); float llo = 9.0, lhi = -1.0;
  vec3 acc = vec3(0.0);
  for (int a = 0; a < 4; a++) for (int b = 0; b < 4; b++) {
    vec2 f = (ij + (vec2(float(a), float(b)) + 0.5) / 4.0) / uGrid;
    vec2 uv = uCardUV.xy + f * uCardUV.zw;
    vec3 c = pow(textureLod(uPage, uv, uLod).rgb, vec3(2.2));
    tap[a * 4 + b] = c; acc += c;
    float l = dot(c, vec3(0.3, 0.5, 0.2));
    if (l < llo) { llo = l; lo = c; }
    if (l > lhi) { lhi = l; hi = c; }
  }
  // a stitch is one yarn: where two colours meet inside it, lean to the one that covers more of it
  vec3 outc = acc / 16.0;
  vec3 dvec = hi - lo; float dl = dot(dvec, dvec);
  if (dl > 0.002) {
    float fsum = 0.0;
    for (int n = 0; n < 16; n++) fsum += clamp(dot(tap[n] - lo, dvec) / dl, 0.0, 1.0);
    float fr = fsum / 16.0;
    outc = mix(lo, hi, smoothstep(0.36, 0.64, fr));
  }
  o = vec4(pow(outc, vec3(1.0 / 2.2)), 1.0);
}
`;

const FS_FABRIC = GLSL_COMMON + `
uniform vec2 uRes;             // target size, device px
uniform float uDpr;            // device px per css px in this target
uniform vec2 uView;            // css size of the window
uniform vec4 uCard;            // x, y, w, h in css px
uniform vec2 uGrid;            // columns, rows
uniform float uU;              // stitches unravelled, counted from the top right
uniform float uTime;
uniform vec3 uCam;             // focus x, y and zoom
uniform vec4 uDent;            // x, y, radius, depth
uniform vec4 uNeedle[2];       // tip x, y, angle, visibility
uniform float uNeedleLen;
uniform sampler2D uFrom;       // rgb: colour before, a: how far the new yarn has come
uniform sampler2D uTo;         // rgb: colour now, a: lift while it is being worked
out vec4 o;

const float V0 = -0.10, V1 = 1.30, XT = 0.325, XB = 0.060, BOW = 0.030, R0 = 0.200;

float order(ivec2 c) { int cols = int(uGrid.x); return float(c.y * cols + ((c.y & 1) == 0 ? cols - 1 - c.x : c.x)); }
float exists(ivec2 c) { return clamp(order(c) + 1.0 - uU, 0.0, 1.0); }

float hmap(vec2 f, float W, float H) {
  ivec2 cell = ivec2(floor(f)); vec2 uv = fract(f);
  int cols = int(uGrid.x), rows = int(uGrid.y);
  if (cell.x < 0 || cell.x >= cols) return 0.0;
  float rW = R0 * W, len = (V1 - V0) * H, z = 0.0;
  for (int dj = -1; dj <= 1; dj++) {
    ivec2 c = ivec2(cell.x, cell.y + dj);
    if (c.y < 0 || c.y >= rows) continue;
    float e = exists(c); if (e <= 0.0) continue;
    float t = (uv.y - float(dj) - V0) / (V1 - V0);
    if (t < -0.2 || t > 1.2) continue;
    float tc = clamp(t, 1.0 - e, 1.0), sn = sin(3.14159265 * tc);
    float spread = mix(XT, XB, tc) + BOW * sn, dsp = (XB - XT) + BOW * 3.14159265 * cos(3.14159265 * tc);
    float da = (t - tc) * len, r = rW * (0.80 + 0.20 * sn), zc = pow(max(sn, 0.0), 0.7) * 0.66 * rW;
    for (int sd = -1; sd <= 1; sd += 2) {
      float fs = float(sd);
      float ty = len / length(vec2(fs * dsp * W, len));
      float dp = (uv.x - (0.5 + fs * spread)) * W * ty;
      float d2 = dp * dp + da * da;
      if (d2 < r * r) z = max(z, zc + sqrt(r * r - d2));
    }
  }
  return z;
}
vec3 wood(vec2 p, float unit, out float sheen) {
  vec2 q = p / unit;
  float pl = q.y / 17.0 + 0.37;
  float id = floor(pl), fy = fract(pl);
  float off = hash11(id) * 311.0;
  float u = q.x + off * 7.0, v = q.y + id * 13.0;
  float warp = (vnoise(vec2(u * 0.016, v * 0.11)) - 0.5) * 3.4 + (vnoise(vec2(u * 0.06, v * 0.4 + 9.0)) - 0.5) * 0.7;
  float s1 = vnoise(vec2(u * 0.022, (v + warp) * 0.75));
  float s2 = vnoise(vec2(u * 0.06, (v + warp) * 2.6 + 40.0));
  float s3 = vnoise(vec2(u * 0.16, (v + warp) * 7.5 + 80.0));
  float s4 = vnoise(vec2(u * 0.5, (v + warp) * 15.0));
  float grain = s1 * 0.42 + s2 * 0.30 + s3 * 0.18 + s4 * 0.10;
  vec3 c = mix(vec3(0.105, 0.052, 0.028), vec3(0.330, 0.185, 0.098), smoothstep(0.22, 0.80, grain));
  c = mix(c, vec3(0.42, 0.26, 0.14), 0.35 * smoothstep(0.62, 0.9, s2));
  c *= 1.0 - 0.45 * smoothstep(0.66, 0.92, s3) * (0.4 + 0.6 * s4);     // pores
  c *= 0.84 + 0.30 * hash11(id + 3.7);
  float seam = smoothstep(0.0, 0.010, fy) * smoothstep(1.0, 0.990, fy);
  c *= mix(0.30, 1.0, seam);
  c *= 1.0 + 0.25 * smoothstep(0.975, 0.99, fy) * seam;
  sheen = (0.35 + 0.65 * s2) * seam;
  return c;
}
float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 pc = frag / uDpr;
  vec2 p = uCam.xy + (pc - uView * 0.5) / uCam.z;
  float px = 1.0 / (uDpr * uCam.z);                 // css px per device px
  float W = uCard.z / uGrid.x, H = uCard.w / uGrid.y;
  float lamp = lampAt(p);

  // the cloth gives a little under the pointer
  vec2 dd = (p - uDent.xy) / uDent.z;
  float fall = exp(-dot(dd, dd) * 1.6) * uDent.w;
  vec2 ps = p + dd * fall * uDent.z * 0.07;
  vec2 bend = dd * fall * 2.1;

  vec2 f = (ps - uCard.xy) / vec2(W, H);
  // hand-knit irregularity
  vec2 wob = vnoise2(f * 0.23 + 3.0) - 0.5;
  f += wob * vec2(0.16, 0.20);
  // soft folds across the cloth
  float e1 = 0.9;
  vec2 fo = f * 0.034 + 11.0;
  vec2 fold = vec2(vnoise(fo + vec2(e1 * 0.034, 0.0)) - vnoise(fo - vec2(e1 * 0.034, 0.0)), vnoise(fo + vec2(0.0, e1 * 0.034)) - vnoise(fo - vec2(0.0, e1 * 0.034)));
  bend += fold * 9.0;

  ivec2 cell = ivec2(floor(f));
  vec2 uv = fract(f);
  int cols = int(uGrid.x), rows = int(uGrid.y);
  float rW = R0 * W;

  // ---- table ----
  float topRow = floor(uU / uGrid.x);
  float yTop = uCard.y + min(topRow, uGrid.y) * H;
  vec2 fc = vec2(uCard.x + uCard.z * 0.5, (yTop + uCard.y + uCard.w) * 0.5);
  vec2 fh = vec2(uCard.z * 0.5, max((uCard.y + uCard.w - yTop) * 0.5, 0.0));
  float wsheen;
  vec3 col = wood(p, W, wsheen) * lamp;
  col += KEY * wsheen * 0.030 * lamp * lamp * lamp;
  float gone = step(uGrid.y - 0.5, topRow);
  float sh1 = sdBox(p - fc - vec2(W * 0.9, W * 1.5), fh - W * 0.4);
  float sh2 = sdBox(p - fc - vec2(W * 0.25, W * 0.45), fh - W * 0.3);
  col *= 1.0 - (1.0 - gone) * (0.50 * smoothstep(W * 2.6, -W * 1.2, sh1) + 0.38 * smoothstep(W * 0.75, -W * 0.3, sh2)) ;

  // ---- stitches ----
  float bZ = -1.0, bCov = 0.0, bS = 0.0, bL = 0.0, bTilt = 0.0, bSeed = 0.0, bMix = 0.0, bR = rW, bD = 0.0, zUnder = 0.0;
  vec2 bT = vec2(0.0, 1.0);
  vec4 bA = vec4(0.0), bB = vec4(0.0);
  float back = 0.0; vec3 backCol = vec3(0.0);
  float fuzz = 0.0; vec3 fuzzCol = vec3(0.0);
  float aa = px * 0.75;
  if (cell.x >= 0 && cell.x < cols && cell.y >= -1 && cell.y <= rows) {
    for (int dj = -1; dj <= 1; dj++) {
      ivec2 c = ivec2(cell.x, cell.y + dj);
      if (c.y < 0 || c.y >= rows) continue;
      float e = exists(c);
      if (e <= 0.0) continue;
      vec4 A = texelFetch(uFrom, c, 0), B = texelFetch(uTo, c, 0);
      float seed = hash21(vec2(c) + 0.5);
      float vl = uv.y - float(dj);
      float g = A.a, pop = B.a;
      float t = (vl - V0) / (V1 - V0);
      float tmin = 1.0 - e;
      float len = (V1 - V0) * H;
      float rr0 = rW * (0.95 + 0.10 * seed) * (1.0 + 0.30 * pop);
      if (dj == 0) { back = e * smoothstep(-0.02, 0.10, min(uv.x, 1.0 - uv.x) + (c.x == 0 || c.x == cols - 1 ? -0.08 : 0.2)); backCol = mix(A.rgb, B.rgb, step(0.5, g)); }
      if (t > -0.25 && t < 1.25) {
        float tc = clamp(t, tmin, 1.0);
        float sn = sin(3.14159265 * tc);
        float spread = mix(XT, XB, tc) + BOW * sn;
        float dsp = (XB - XT) + BOW * 3.14159265 * cos(3.14159265 * tc);
        float da = (t - tc) * len;
        float r = rr0 * (0.80 + 0.20 * sn);
        float zc = pow(max(sn, 0.0), 0.7) * 0.66 * rW + 0.35 * pop * rW;
        for (int sd = -1; sd <= 1; sd += 2) {
          float fs = float(sd);
          vec2 T = normalize(vec2(fs * dsp * W, len));
          float dx = (uv.x - (0.5 + fs * spread)) * W;
          float dp = dx * T.y;
          float d = length(vec2(dp, da));
          float cov = smoothstep(r + aa, r - aa, d);
          float z = zc + sqrt(max(r * r - d * d, 0.0)) + fs * 0.02 * rW;
          float fz = smoothstep(r * 1.75, r * 0.9, d);
          if (fz > fuzz) { fuzz = fz; fuzzCol = mix(A.rgb, B.rgb, step(1.0 - g, tc)); }
          if (cov > 0.004 && z > bZ) {
            zUnder = max(zUnder, bZ);
            bZ = z; bCov = cov; bS = clamp(dp / r, -1.0, 1.0); bT = T; bL = tc * len / (2.0 * rW) + seed * 9.0 + fs * 0.25; bTilt = (0.66 * rW * 3.14159 * cos(3.14159265 * tc)) / len * 0.9;
            bSeed = seed + fs * 0.13; bA = A; bB = B; bMix = smoothstep(-0.16, 0.16, tc - (1.0 - g) + (g - 0.5) * 0.34); bR = r; bD = d;
          } else if (cov > 0.004) zUnder = max(zUnder, z);
        }
      }
      // the free loop on top of a stitch with nothing knitted above it
      bool open = c.y == 0 || exists(ivec2(c.x, c.y - 1)) <= 0.0;
      if (open && e >= 1.0 && vl < V0 + 0.35) {
        vec2 q = vec2((uv.x - 0.5) * W, (vl - V0 - 0.02) * H);
        vec2 rad = vec2(XT * W, 0.40 * H);
        vec2 qn = q / rad;
        float rho = length(qn);
        float m = min(rad.x, rad.y);
        float d = abs(rho - 1.0) * m;
        float r = rr0 * 0.86;
        float cov = smoothstep(r + aa, r - aa, d) * smoothstep(0.30, -0.05, qn.y);
        float z = 0.30 * rW + sqrt(max(r * r - d * d, 0.0));
        float fz = smoothstep(r * 1.75, r * 0.9, d) * smoothstep(0.30, -0.05, qn.y);
        if (fz > fuzz) { fuzz = fz; fuzzCol = B.rgb; }
        if (cov > 0.004 && z > bZ) {
          zUnder = max(zUnder, bZ);
          vec2 T = normalize(vec2(-qn.y * rad.x, qn.x * rad.y) + 1e-5);
          bZ = z; bCov = cov; bS = clamp((rho - 1.0) * m / r, -1.0, 1.0); bT = T; bL = atan(qn.y, qn.x) * m / (2.0 * rW) + seed * 9.0; bTilt = 0.0;
          bSeed = seed + 0.31; bA = A; bB = B; bMix = step(0.5, g); bR = r; bD = d;
        }
      }
    }
  }
  float detail = smoothstep(2.2, 6.5, 2.0 * rW / px);
  // stocking stitch rolls a little at its sides: light catches the roll, then it turns under
  float edgeL = f.x, edgeR = uGrid.x - f.x;
  float roll = 1.0 + 0.10 * (smoothstep(2.6, 0.9, edgeL) - 1.6 * smoothstep(0.9, 0.0, edgeL)) * step(0.0, edgeL)
                   - 0.05 * smoothstep(2.6, 1.0, edgeR) * step(0.0, edgeR) - 0.22 * smoothstep(0.9, 0.0, edgeR) * step(0.0, edgeR);
  float rowTone = (0.965 + 0.07 * hash11(float(cell.y) * 1.7 + 4.0)) * roll;
  if (back > 0.0) {
    vec3 bc = toLin(backCol) * 0.085 * lamp;
    col = mix(col, bc, back);
  }
  if (bCov > 0.0) {
    vec3 alb = toLin(mix(bA.rgb, bB.rgb, bMix)) * rowTone * (0.95 + 0.10 * fract(bSeed * 7.3));
    float zn = clamp(bZ / (1.66 * rW), 0.0, 1.0);
    float ao = mix(0.26, 1.0, smoothstep(0.08, 0.92, zn));
    ao *= mix(1.0, 0.80 + 0.20 * smoothstep(0.0, 0.5 * rW, bZ - zUnder), 0.6);
    // shadow from the yarn next door, towards the lamp
    vec2 ls = normalize(LDIR.xy) * rW / vec2(W, H);
    float h1 = hmap(f + ls * 0.75, W, H), h2 = hmap(f + ls * 1.7, W, H);
    float shd = smoothstep(0.0, 0.45 * rW, h1 - bZ - 0.75 * rW * 0.62) * 0.55 + smoothstep(0.0, 0.6 * rW, h2 - bZ - 1.7 * rW * 0.62) * 0.45;
    ao *= 1.0 - 0.62 * shd;
    vec3 yc = shadeYarn(alb, bS, bL, bT, bTilt, detail, ao, bSeed, bend) * lamp;
    yc *= 1.0 + 0.5 * bB.a;
    col = mix(col, yc, bCov);
  }
  if (fuzz > 0.0) {
    // loose fibres standing off the yarn
    float fn = vnoise(f * vec2(46.0, 37.0) + 5.0) * 0.6 + vnoise(f * vec2(19.0, 23.0)) * 0.4;
    float fa = fuzz * (1.0 - bCov) * smoothstep(0.25, 0.80, fn + fuzz * 0.40) * (0.30 + 0.60 * detail);
    col = mix(col, toLin(fuzzCol) * lamp * 0.72, fa * 0.85);
  }

  // ---- needles ----
  for (int n = 0; n < 2; n++) {
    vec4 nd = uNeedle[n];
    if (nd.w <= 0.0) continue;
    vec2 ax = -vec2(cos(nd.z), sin(nd.z));          // from the tip back along the shaft
    float R = 0.60 * W;
    for (int pass = 0; pass < 2; pass++) {
      vec2 q = p - nd.xy;
      float tau0 = clamp(dot(q, ax), 0.0, uNeedleLen);
      float lift = 0.6 + tau0 * 0.045;
      if (pass == 0) q -= vec2(0.62, 0.80) * lift * W * 0.55;
      float tau = clamp(dot(q, ax), 0.0, uNeedleLen);
      vec2 off = q - ax * tau;
      float rr = R * mix(0.22, 1.0, smoothstep(0.0, 7.0 * W, tau));
      float knob = smoothstep(uNeedleLen - 1.2 * W, uNeedleLen - 0.2 * W, tau);
      rr *= 1.0 + 0.9 * knob;
      float d = length(off);
      if (pass == 0) {
        float soft = (0.5 + lift * 0.55) * W * 0.5;
        col *= 1.0 - 0.52 * smoothstep(rr + soft, rr - soft * 0.6, d) * nd.w;
      } else {
        float cov = smoothstep(rr + aa, rr - aa, d) * nd.w;
        if (cov > 0.0) {
          vec2 P = vec2(ax.y, -ax.x);
          float s = clamp(dot(off, P) / rr, -1.0, 1.0);
          vec3 N = normalize(vec3(P * s, sqrt(max(1.0 - s * s, 0.0)) + 0.05));
          float gr = vnoise(vec2(tau / W * 0.5, s * 2.2 + float(n) * 9.0));
          vec3 alb = mix(vec3(0.60, 0.40, 0.20), vec3(0.80, 0.60, 0.36), gr) * mix(1.0, 0.72, knob);
          float nl = clamp((dot(N, LDIR) + 0.25) / 1.25, 0.0, 1.0);
          vec3 Hh = normalize(LDIR + vec3(0.0, 0.0, 1.0));
          float sp = pow(max(dot(N, Hh), 0.0), 70.0);
          vec3 nc = alb * (KEY * nl * 1.25 + AMB * 0.30) * lamp + KEY * sp * 0.55 * lamp;
          col = mix(col, nc, cov);
        }
      }
    }
  }

  // window edges fall off into the dark
  vec2 vq = pc / uView - 0.5;
  col *= 1.0 - 0.55 * smoothstep(0.35, 0.95, length(vq * vec2(1.0, 0.92)) * 1.25);
  o = vec4(finish(col, gl_FragCoord.xy), 1.0);
}
`;

// Loose yarn: the thread, the strand you pull and the heap, drawn as ribbons.
const VS_YARN = `#version 300 es
precision highp float;
precision highp int;
layout(location = 0) in vec4 aPT;     // position, tangent
layout(location = 1) in vec4 aSD;     // side, length along, stitch number, order
layout(location = 2) in float aW;     // width scale
uniform vec2 uOrigin; uniform float uScale; uniform float uHalf;
uniform vec3 uCam; uniform vec2 uView; uniform vec2 uGrid;
uniform sampler2D uTo;
uniform float uCount;
out float vS; out float vL; out vec2 vT; out vec3 vCol; out float vAge; out vec2 vP; out float vSeed;
const float SK = 1.7;
void main() {
  vec2 T = normalize(aPT.zw + 1e-6);
  vec2 Nn = vec2(T.y, -T.x);
  vec2 pos = uOrigin + aPT.xy * uScale + Nn * aSD.x * uHalf * SK * aW;
  vS = aSD.x * SK; vL = aSD.y * uScale / (2.0 * uHalf); vT = T; vP = pos;
  int cols = int(uGrid.x);
  int k = clamp(int(aSD.z), 0, cols * int(uGrid.y) - 1);
  int j = k / cols, ii = k - j * cols;
  int i = (j & 1) == 0 ? cols - 1 - ii : ii;
  vCol = texelFetch(uTo, ivec2(i, j), 0).rgb;
  vAge = uCount - aSD.w;
