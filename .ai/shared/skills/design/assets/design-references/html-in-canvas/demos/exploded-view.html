#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.turning{cursor:grabbing}

/* ---------------------------------------------------------------- the page that gets taken apart */
#stage{position:relative;width:100vw;height:100vh;pointer-events:none}
#sheet,.card,.slot>.in,.pin{pointer-events:auto}
#page{position:relative;width:1200px;height:700px;font-size:14px;line-height:1.35;
  --ink:#1c2330;--ink2:#5d6778;--ink3:#8a93a3;--rule:#e2e5ea;--card:#ffffff;--paper:#f6f5f1;--red:#e2482b;
  --base:#aebdcc;--lake:#86b3d1;--lakeline:#5f93b6;--minor:rgba(34,52,80,.17);--label:rgba(34,52,80,.8)}
#page[data-season="summer"]{--base:#7ea27c;--lake:#4b9ccb;--lakeline:#2f7fb0;--minor:rgba(40,50,30,.19);--label:rgba(40,50,30,.66)}
#page ::selection{background:rgba(226,72,43,.2)}
#page input::selection{background:rgba(226,72,43,.2)}

#sheet{transform-origin:0 0;position:absolute;inset:0;background:var(--paper);border-radius:16px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;color:var(--ink2);font-size:13px}
.brand svg{width:18px;height:18px;flex:none}
.brand b{color:var(--ink);font-weight:600}
.brand .meta{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
#sheet .basemap{position:absolute;left:20px;top:20px;width:660px;height:660px;background:var(--base);border-radius:3px;overflow:hidden}
#sheet .basemap svg{position:absolute;inset:0;width:100%;height:100%}

#map{position:absolute;left:20px;top:20px;width:660px;height:660px}
.band{transform-origin:0 0;position:absolute;pointer-events:none;user-select:none}
.band svg{display:block;width:100%;height:100%;overflow:visible}
.band .fill{fill:var(--c);pointer-events:auto}
.band .minor{fill:none;stroke:var(--minor);stroke-width:.7}
.band .lake{fill:var(--lake);stroke:var(--lakeline);stroke-width:1}
.band .route{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.band .casing{fill:none;stroke:rgba(255,255,255,.85);stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round}
.band text{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;fill:var(--label);text-anchor:middle;dominant-baseline:central}
#page[data-season="winter"] .band .fill{fill:var(--w)}
#page[data-season="summer"] .band .fill{fill:var(--s)}

#map.apart .band .route,#map.apart .band .casing,#sheet.apart .r0{visibility:hidden}
.pin{position:absolute;left:0;top:0;z-index:5;transform-origin:0 0;appearance:none;border:0;background:none;padding:0 0 13px;margin:0;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
.pin span{display:flex;align-items:baseline;gap:7px;background:#fff;border-radius:7px;padding:4px 9px 5px;box-shadow:0 0 0 1px rgba(28,35,48,.14)}
.pin em{font-family:"Instrument Serif",serif;font-style:italic;font-size:17px;line-height:1.1}
.pin small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink2)}
.pin::after{content:"";position:absolute;left:50%;bottom:8px;width:9px;height:9px;margin-left:-4.5px;background:#fff;transform:rotate(45deg);box-shadow:1px 1px 0 0 rgba(28,35,48,.14)}
.pin.hot span,.pin:hover span,.pin:focus-visible span{background:var(--ink);color:#fff}
.pin.hot small,.pin:hover small,.pin:focus-visible small{color:#c5ccd8}
.pin.hot::after,.pin:hover::after,.pin:focus-visible::after{background:var(--ink)}
.pin:focus{outline:none}
.hiker{position:absolute;left:0;top:0;z-index:5;transform-origin:0 0;width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 3px #fff,0 0 0 1px rgba(28,35,48,.25);pointer-events:auto}

#side{position:absolute;left:700px;top:20px;width:480px;height:660px;display:flex;flex-direction:column;gap:12px}
.slot{position:relative}
.card{transform-origin:0 0;position:absolute;inset:0;background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.slot>.in{position:relative;transform-origin:0 0;padding:16px 18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

#c-title .in{padding-bottom:15px}
#title{display:block;width:100%;margin:5px 0 4px -8px;padding:2px 8px 3px;border:0;border-radius:8px;background:transparent;
  font:italic 400 34px/1.15 "Instrument Serif",serif;color:var(--ink);letter-spacing:-.005em;caret-color:var(--red)}
#title:hover{background:#f3f4f6}
#title:focus{outline:none;background:#f3f4f6;box-shadow:0 0 0 1.5px rgba(28,35,48,.22)}
#c-title p{margin:0;color:var(--ink2)}

#c-stats .in{padding:14px 18px 10px}
#c-stats .nums{display:grid;grid-template-columns:repeat(3,1fr)}
#profile{display:block;width:444px;height:86px;margin-top:10px;overflow:visible}
#profile .area{fill:rgba(226,72,43,.10)}
#profile .line{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linejoin:round}
#profile .tick{stroke:var(--rule);stroke-width:1}
#profile .dot{fill:var(--red)}
#profile .cur{fill:#fff;stroke:var(--red);stroke-width:2.5}
#profile text{font:600 9.5px "Instrument Sans",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
#profile .ax{font:400 10px "IBM Plex Mono",monospace;fill:var(--ink3);text-anchor:start}
#c-stats .nums div+div{border-left:1px solid var(--rule);padding-left:16px}
#c-stats output{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:1px}
#c-stats output span{font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}

#c-light .row{display:flex;align-items:baseline;justify-content:space-between}
#clock{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink)}
#sun{appearance:none;display:block;width:100%;height:26px;margin:7px 0 2px;background:transparent;cursor:pointer}
#sun::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#f3a25b 0%,#f6d98b 20%,#fdf6dc 45%,#f6d98b 70%,#ee7e4a 88%,#3b4a78 93%,#1f2847 100%);box-shadow:inset 0 0 0 1px rgba(28,35,48,.08)}
#sun::-webkit-slider-thumb{appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:var(--th,#fff);box-shadow:0 0 0 1.5px var(--ink),inset 0 0 0 2.5px #fff,0 2px 4px rgba(28,35,48,.25)}
#sun:focus{outline:none}
#sun:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2.5px var(--ink),0 0 0 5px #ffd9a8}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.season{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:3px;border-radius:10px;background:#eef0f3}
.season label{position:relative;display:block;text-align:center;padding:6px 0;border-radius:7px;font-weight:500;color:var(--ink2);cursor:pointer}
.season input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.season label:has(input:checked){background:var(--ink);color:#fff}
.season label:has(input:focus-visible){box-shadow:0 0 0 2px var(--ink)}

#c-way{flex:1;min-height:0}
#c-way .in{padding:13px 10px 6px}
#c-way .eyebrow{padding:0 8px 6px}
#ways{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px}
.way{appearance:none;display:grid;grid-template-columns:26px 1fr;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:7px 8px 8px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.way b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:600}
.way em{font-family:"Instrument Serif",serif;font-style:italic;font-size:19px;line-height:1.05;display:block}
.way small{display:block;font-size:12px;line-height:1.2;color:var(--ink3)}
.way code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2)}
.way:hover,.way.hot,.way:focus-visible{background:#f1f2f5;outline:none}

/* ---------------------------------------------------------------- around the canvas */
#bar{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:16px;pointer-events:none;z-index:3;transition:opacity .5s}
#toggle{pointer-events:auto;appearance:none;border:0;border-radius:999px;padding:11px 20px 12px;min-width:206px;background:#1c2330;color:#fff;font:600 14px/1 "Instrument Sans",sans-serif;cursor:pointer;box-shadow:0 6px 18px -6px rgba(28,35,48,.5)}
#toggle:hover{background:#2a3345}
#toggle:focus-visible{outline:2px solid #1c2330;outline-offset:3px}
#hint{transition:color .4s;font-size:13px;color:#4b5261;position:absolute;left:calc(50% + 122px);white-space:nowrap}
#what{position:fixed;top:18px;right:22px;z-index:3;display:none;align-items:center;gap:6px;padding:8px 13px 9px;border-radius:999px;background:rgba(255,255,255,.72);color:#1c2330;font:500 13px/1 "Instrument Sans",sans-serif;text-decoration:none;box-shadow:0 0 0 1px rgba(28,35,48,.12)}
#what:hover{background:#fff}
#what svg{width:11px;height:11px}
#tag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;max-width:420px;padding:5px 10px 6px;border-radius:999px;background:rgba(255,255,255,.94);color:#4b5261;box-shadow:0 0 0 1px rgba(28,35,48,.14),0 4px 12px -4px rgba(28,35,48,.3);font:400 12px/1.25 "IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .12s}
#tag.on{opacity:1}
#tag b{color:#c93a20;font-weight:400}
body.apart #hint{color:#efe9df}
@media (max-width:900px){#hint{display:none}}
</style>
<canvas id="gl" content="drawable" layoutsubtree tabindex="-1">
 <div id="stage">
  <div id="page" data-season="winter">
    <div id="sheet" drawable>
      <div class="basemap"><svg id="base-svg" viewBox="0 0 660 660"></svg></div>
    </div>
    <div id="map"></div>
    <aside id="side">
      <section class="slot" id="c-title"><div class="card" drawable></div><div class="in" drawable>
        <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 16.5 7.6 5l3.3 5.6 2-2.9 5.6 8.8z" fill="#1c2330"/><path d="M7.6 5l1.9 3.3-1.6 1.2-1.5-1.2z" fill="#fff" opacity=".9"/></svg><b>Tour planner</b><span class="meta">Contours every 100 m</span></div>
        <label class="eyebrow" for="title">Tour</label>
        <input id="title" type="text" value="East ridge of Piz Lun&eacute;a" spellcheck="false" autocomplete="off" maxlength="34">
        <p>Out and back from the hut. Exposed above the saddle.</p>
      </div></section>
      <section class="slot" id="c-stats"><div class="card" drawable></div><div class="in" drawable>
        <div class="nums">
          <div><span class="eyebrow">Distance</span><output id="s-km"></output></div>
          <div><span class="eyebrow">Ascent</span><output id="s-up"></output></div>
          <div><span class="eyebrow">Time</span><output id="s-h"></output></div>
        </div>
        <svg id="profile" viewBox="0 0 444 86" role="img" aria-label="Elevation along the route"></svg>
      </div></section>
      <section class="slot" id="c-light"><div class="card" drawable></div><div class="in" drawable>
        <div class="row"><label class="eyebrow" for="sun">Sun</label><output id="clock" for="sun"></output></div>
        <input id="sun" type="range" min="0" max="1000" value="760" step="1" aria-label="Time of day">
        <div class="ends"><span>Sunrise</span><span>Night</span></div>
        <div class="season" role="radiogroup" aria-label="Season">
          <label><input type="radio" name="season" value="winter" checked>Winter</label>
          <label><input type="radio" name="season" value="summer">Summer</label>
        </div>
      </div></section>
      <section class="slot" id="c-way"><div class="card" drawable></div><div class="in" drawable>
        <div class="eyebrow">Waypoints</div>
        <div id="ways"></div>
      </div></section>
    </aside>
  </div>
 </div>
</canvas>

<div id="bar"><button id="toggle" type="button">Put it back together</button><span id="hint">Drag to turn. Scroll to pull apart.</span></div>

<div id="tag" aria-hidden="true"></div>
