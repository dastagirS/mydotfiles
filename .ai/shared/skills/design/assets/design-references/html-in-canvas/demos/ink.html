:root{
  /* Layout: one printed specimen sheet lying in a marbling tray. A giant headline top left overprints a
     pigment disc; under it a short text, a checklist and a strip of ink drawdowns; the tools sit on the bottom rule. */
  --paper:#e8ecea;
  --ink:#0f2463;
  --sun:#e9aa00;
  --over:#0b5c45;
  --rose:#a31c44;
  --viridian:#0a6452;
  --faint:color-mix(in srgb,var(--ink) 42%,var(--paper));
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --u:1px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--display)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#page{
  box-sizing:border-box;position:relative;overflow:hidden;width:100vw;height:100vh;isolation:isolate;
  background:var(--paper);color:var(--ink);font-family:var(--display);
  padding-block:calc(36*var(--u)) calc(38*var(--u));
  padding-left:max(16px,env(safe-area-inset-left,0px),calc(64*var(--u)));
  padding-right:max(16px,env(safe-area-inset-right,0px),calc(64*var(--u)));
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr) auto;column-gap:calc(56*var(--u));
  user-select:none;-webkit-user-select:none;cursor:grab;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}
#page.dragging{cursor:grabbing}
#page *{box-sizing:border-box}
#page ::selection{background:color-mix(in srgb,var(--sun) 60%,var(--paper))}

.bar,.deck{grid-column:1/-1}
.bar{display:flex;align-items:baseline;justify-content:space-between;position:relative;z-index:3;line-height:1}
.mark{font-size:calc(34*var(--u));font-weight:900;letter-spacing:-.02em;font-variation-settings:"opsz" 72,"SOFT" 100,"WONK" 1}
.lab{font-family:var(--mono);font-size:calc(10*var(--u));letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
#what{font-family:var(--mono);font-size:calc(12*var(--u));letter-spacing:.02em;color:var(--ink);text-decoration:underline;text-underline-offset:.3em;text-decoration-thickness:calc(1.5*var(--u));cursor:pointer}
#what:hover{text-decoration-thickness:calc(3*var(--u))}

.top{position:relative;min-height:0}
/* The disc overprints the headline: inside it the letters are printed again in the mixed colour. */
.sun{position:absolute;z-index:2;width:calc(480*var(--u));aspect-ratio:1;border-radius:50%;background:var(--sun);left:calc(562*var(--u));top:calc(6*var(--u));overflow:hidden;pointer-events:none}
.hl{
  margin:0;font-size:calc(232*var(--u));line-height:.83;font-weight:900;letter-spacing:-.035em;
  font-variation-settings:"opsz" 144,"SOFT" 100,"WONK" 1;
  overflow-wrap:break-word;text-wrap:balance;width:calc(1010*var(--u));max-width:100%;
}
.dot{position:absolute;z-index:3;aspect-ratio:1;border-radius:50%;mix-blend-mode:multiply;pointer-events:none}
.dot.rose{width:calc(250*var(--u));left:calc(885*var(--u));top:calc(345*var(--u));background:var(--rose)}
.dot.viri{width:calc(140*var(--u));left:calc(1004*var(--u));top:calc(78*var(--u));background:var(--viridian)}
#head{position:relative;z-index:1;margin-top:calc(22*var(--u));padding-bottom:.2em;margin-bottom:-.2em;
  -webkit-mask-image:radial-gradient(circle calc(240*var(--u)) at calc(802*var(--u)) calc(224*var(--u)),transparent calc(100% - .7px),#000 100%);
  mask-image:radial-gradient(circle calc(240*var(--u)) at calc(802*var(--u)) calc(224*var(--u)),transparent calc(100% - .7px),#000 100%)}
#over{position:absolute;left:calc(-562*var(--u));top:calc(16*var(--u));color:var(--over);max-width:none}

/* Everything hangs on four lines: the left margin, the disc's left edge, the disc's centre, the colour strip. */
.notes{position:relative;z-index:1;display:grid;grid-template-columns:calc(562*var(--u)) auto;justify-content:start;align-items:start;padding-bottom:calc(46*var(--u))}
.prose{margin:0;max-width:calc(384*var(--u));font-size:calc(17*var(--u));line-height:1.45;font-weight:420;font-variation-settings:"opsz" 14,"SOFT" 50,"WONK" 0}
.try{list-style:none;margin:calc(4*var(--u)) 0 0 calc(-27*var(--u));padding:0;display:grid;gap:calc(11*var(--u))}
.try label{display:flex;align-items:center;gap:calc(12*var(--u));font-family:var(--mono);font-size:calc(13*var(--u));line-height:1.2;cursor:pointer;white-space:nowrap}
.try b{font-weight:400;color:var(--faint);margin-right:calc(2*var(--u))}
.try input{appearance:none;-webkit-appearance:none;margin:0;width:calc(15*var(--u));height:calc(15*var(--u));border:calc(1.5*var(--u)) solid var(--ink);border-radius:calc(1.5*var(--u));background:transparent;cursor:pointer;flex:none}
.try input:checked{background:var(--ink);box-shadow:inset 0 0 0 calc(2.5*var(--u)) var(--paper)}
.try input:checked ~ span{text-decoration:line-through;text-decoration-thickness:calc(1.5*var(--u))}

/* Ink drawdowns down the right edge: a full-strength band over two thinned ones, as a printer proofs a colour. */
.pigs{border:0;margin:calc(27*var(--u)) 0 0;padding:0;min-width:0;grid-column:2;grid-row:2/4;align-self:start;display:grid;gap:calc(14*var(--u))}
.pigs label{display:grid;gap:calc(8*var(--u));cursor:pointer;width:calc(104*var(--u))}
.pigs input{appearance:none;-webkit-appearance:none;margin:0;width:100%;height:calc(86*var(--u));border-radius:calc(1.5*var(--u));cursor:pointer;
  background:linear-gradient(var(--c) 0 62%,color-mix(in srgb,var(--c) 52%,var(--paper)) 62% 82%,color-mix(in srgb,var(--c) 22%,var(--paper)) 82% 100%)}
.pigs span{white-space:nowrap}
.pigs input:checked{box-shadow:calc(-9*var(--u)) 0 0 0 var(--paper),calc(-12.5*var(--u)) 0 0 0 var(--ink)}
.pigs label:hover input:not(:checked){box-shadow:calc(-9*var(--u)) 0 0 0 var(--paper),calc(-10.5*var(--u)) 0 0 0 var(--faint)}

.deck{position:relative;z-index:2;display:grid;grid-template-columns:calc(732*var(--u)) minmax(0,1fr) calc(104*var(--u));column-gap:calc(56*var(--u));border-top:calc(1*var(--u)) solid var(--ink)}
.cell{display:grid;grid-template-rows:auto calc(46*var(--u));row-gap:calc(12*var(--u));min-width:0;padding-top:calc(19*var(--u));position:relative}

<canvas id="stage" content="drawable" layoutsubtree>
  <main id="page" drawable>
    <header class="bar">
      <span class="mark">Ink</span>
      <a id="what" target="_blank" rel="noopener" hidden>What is this?</a>
    </header>
    <div class="top">
      <div class="sun" aria-hidden="true"><div class="hl" id="over">Stir the page.</div></div>
      <h1 class="hl" id="head">Stir the page.</h1>
      <div class="dot rose" aria-hidden="true"></div>
      <div class="dot viri" aria-hidden="true"></div>
    </div>
    <div class="notes">
      <p class="prose">This sheet is printed in wet ink. Drag across it and the ink follows your hand. The text box still takes typing and the colours still click, wherever they drift. Press Esc and every letter flows back to its place.</p>
      <ul class="try">
        <li><label><input type="checkbox" id="t-stir"><b>01</b><span>Drag to stir</span></label></li>
        <li><label><input type="checkbox" id="t-type"><b>02</b><span>Type while it moves</span></label></li>
        <li><label><input type="checkbox" id="t-pig"><b>03</b><span>Pick another colour</span></label></li>
        <li><label><input type="checkbox" id="t-settle"><b>04</b><span>Press Esc to settle</span></label></li>
      </ul>
    </div>
    <fieldset class="pigs" aria-label="Ink colour">
      <label style="--c:#0f2463"><input type="radio" name="pig" id="p-prussian" value="#0f2463" data-over="#0b5c45" checked><span class="lab">Prussian blue</span></label>
      <label style="--c:#a31c44"><input type="radio" name="pig" id="p-madder" value="#a31c44" data-over="#b3260f"><span class="lab">Rose madder</span></label>
      <label style="--c:#0a6452"><input type="radio" name="pig" id="p-viridian" value="#0a6452" data-over="#0a6a2a"><span class="lab">Viridian</span></label>
      <label style="--c:#8c3a14"><input type="radio" name="pig" id="p-sienna" value="#8c3a14" data-over="#7a2f00"><span class="lab">Burnt sienna</span></label>
      <label style="--c:#161513"><input type="radio" name="pig" id="p-black" value="#161513" data-over="#14130f"><span class="lab">Lamp black</span></label>
    </fieldset>
    <footer class="deck">
      <label class="cell field"><span class="lab">Headline</span>
        <input id="words" type="text" maxlength="24" placeholder="Type a new headline" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="cell gauge"><span class="lab ends"><span>Thin ink</span><span>Thick ink</span></span>
        <input id="thick" type="range" min="0" max="100" value="76" aria-label="How thick the ink is">
      </label>
      <div class="cell"><span class="lab">Esc</span>
        <button id="settle" type="button">Settle</button>
      </div>
    </footer>
  </main>
</canvas>

function fitHead() {
  const tall = page.classList.contains('tall');
  const base = tall ? 160 : 232, maxH = (tall ? 330 : 446) * U;
  let size = base;
  for (let i = 0; i < 14; i++) {
    head.style.fontSize = 'calc(' + size + '*var(--u))';
    if (head.scrollHeight <= maxH + 1 && head.scrollWidth <= head.clientWidth + 1) break;
    size *= 0.92;
  }
  // The overprinted copy inside the disc has to break its lines exactly as the headline does.
  over.style.fontSize = head.style.fontSize; over.style.width = head.offsetWidth + 'px';
}
function setHead(t) { head.textContent = over.textContent = t.trim() ? t : DEFAULT_HEAD; fitHead(); }

in vec2 a; out vec2 v; uniform float uY;
void main(){ v=a*.5+.5; gl_Position=vec4(a.x,a.y*uY,0.,1.); }`;
const FS = (body) => `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 v; out vec4 o;
${body}`;

function program(fsBody) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS(fsBody)]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}

// Lays pigment under the comb. A small mesh around the stroke is carried through the map onto the sheet,
// so the mark is stored where the sheet was at that moment. Stored as a distance, it stays sharp at any pull.
function layProgram() {
  const p = gl.createProgram();
  const src = [[gl.VERTEX_SHADER, `#version 300 es
    precision highp float; precision highp sampler2D;
    in vec2 a; out vec2 hs; uniform sampler2D uMap; uniform vec2 uA,uB; uniform float uR,uAsp;
    void main(){ vec2 lo=min(uA,uB)-uR*2.05, hi=max(uA,uB)+uR*2.05; hs=mix(lo,hi,a);
      vec2 uv=hs/vec2(uAsp,1.); vec2 q=uv+texture(uMap,uv).xy; gl_Position=vec4(q*2.-1.,0.,1.); }`],
    [gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    in vec2 hs; uniform vec2 uA,uB; uniform float uR,uRings; uniform vec4 uCa,uCb;
    layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
    void main(){ vec2 pa=hs-uA,ba=uB-uA; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-9),0.,1.);
      float dd=length(pa-ba*h); float c=clamp(1.-dd/(2.*uR),0.,1.);
      if(uRings>0.) c=dd<uR*1.9 ? .5+.42*cos(6.2832*dd/(uR*.76))*smoothstep(1.9,1.6,dd/uR) : 0.;
      o0=uCa*c; o1=uCb*c; }`]];
  for (const [type, text] of src) {
    const sh = gl.createShader(type); gl.shaderSource(sh, text); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);

  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
